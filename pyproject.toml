[project]
name = "lube-match"
version = "0.1.0"
description = "Recomendador de lubricantes industriales basado en métodos multivariados"
authors = [
    { name = "Oscar Baltazar", email = "oybaltazar@gmail.com" },
    { name = "Jun Lee", email = "a01643044@tec.mx" },
    { name = "Tamara Hernandez", email = "tamara.romero.h7@gmail.com" },
    { name = "Fernanda Velderrain", email = "fernandavelderrain@yahoo.com.mx" },
]
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "gower>=0.1.2",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "nbstripout>=0.9.1",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.64.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
